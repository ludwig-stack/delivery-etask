services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env.production.local
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      DSI_DATA_PATH: /app/data/delivery.sqlite
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - delivery-data:/app/data
    stop_grace_period: 20s
volumes:
  delivery-data:
